<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1021;
    --panel: #131a33;
    --panel-2: #19224261;
    --panel-solid: #192242;
    --line: #232d52;
    --text: #e9edfb;
    --muted: #8b95b8;
    --purple: #7b4fe8;
    --purple-hover: #8d66f0;
    --empty: #0f1530;
    --empty-line: #1b2444;

    --d1: #8e3b40;   /* low */
    --d2: #8d6030;   /* moderate */
    --d3: #3f7d5a;   /* high */
    --d4: #27593c;   /* higher */

    --m1: #5a2a30;
    --m2: #5c4025;
    --m3: #2f5f46;
    --m4: #234b35;

    --label-w: 192px;
    --cell-w: 104px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 15px; line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #a995ff; outline-offset: 2px; }
  h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 16px 80px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .top h1 { font-size: 1.6rem; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: .9rem; }

  .btn {
    border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600;
    background: var(--panel-solid); color: var(--text); border: 1px solid var(--line);
  }
  .btn.primary { background: var(--purple); border-color: var(--purple); color: #fff; }
  .btn.primary:hover { background: var(--purple-hover); }
  .btn.danger { color: #ff8087; }
  .btn.small { padding: 6px 12px; font-size: .88rem; font-weight: 500; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin: 0 0 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; background: var(--empty); border: 1px solid var(--empty-line); }
  .legend i.c1 { background: var(--d1); border-color: transparent; }
  .legend i.c2 { background: var(--d2); border-color: transparent; }
  .legend i.c3 { background: var(--d3); border-color: transparent; }
  .legend i.c4 { background: var(--d4); border-color: transparent; }

  .c1 { background: var(--d1); }
  .c2 { background: var(--d2); }
  .c3 { background: var(--d3); }
  .c4 { background: var(--d4); }

  /* ---------- board ---------- */
  .board { overflow-x: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .rows { display: flex; flex-direction: column; gap: 8px; min-width: max-content; }
  .row { display: flex; gap: 8px; }

  .label {
    position: sticky; left: 0; z-index: 3;
    flex: 0 0 var(--label-w); width: var(--label-w);
    display: flex; align-items: center; border-radius: 12px;
    box-shadow: 8px 0 0 0 var(--bg);
    min-height: 80px;
  }
  .label.m1 { background: var(--m1); }
  .label.m2 { background: var(--m2); }
  .label.m3 { background: var(--m3); }
  .label.m4 { background: var(--m4); }
  .label .open {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: none; border: 0; text-align: left; padding: 8px 0 8px 10px; color: #fff; border-radius: 12px;
  }
  .label .txt { min-width: 0; display: flex; flex-direction: column; }
  .label .nm { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label small { font-size: .68rem; color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
  .label .dots {
    flex: 0 0 30px; align-self: stretch; background: none; border: 0; color: rgba(255,255,255,.8);
    font-size: 1.2rem; border-radius: 12px;
  }
  .ring { flex: 0 0 auto; }

  .cell {
    flex: 0 0 var(--cell-w); width: var(--cell-w); height: 80px; border: 0; border-radius: 12px;
    color: #fff; position: relative; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .cell .d { font-size: .7rem; font-weight: 500; opacity: .85; }
  .cell b { font-size: 1.05rem; font-weight: 700; }
  .cell:not(.none):hover { filter: brightness(1.15); }
  .cell.none { background: var(--empty); border: 1px solid var(--empty-line); color: var(--muted); }
  .cell.none:hover { border-color: #3a4678; color: var(--text); }
  .cell.today { box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
  .note-dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .9; }

  .more { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: .85rem; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .empty-state p { margin: 0 0 16px; }

  footer { margin-top: 32px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: .85rem; }

  /* ---------- topic view ---------- */
  .back { margin-bottom: 14px; }
  .thead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
  .thead .who { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .thead h1 { font-size: 1.6rem; overflow-wrap: anywhere; }
  .thead .ring-wrap { flex: 0 0 auto; border-radius: 50%; padding: 6px; }
  .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=text], textarea {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); min-width: 0;
  }
  select { padding: 8px 10px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 18px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 1.5rem; line-height: 1.2; font-weight: 700; }
  .stat span { color: var(--muted); font-size: .82rem; }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 22px 0 10px; flex-wrap: wrap; }
  .sec-head h2 { font-size: 1.15rem; }
  .entry {
    background: var(--panel); border: 1px solid var(--line); border-left-width: 5px; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .entry.b1 { border-left-color: var(--d1); }
  .entry.b2 { border-left-color: var(--d2); }
  .entry.b3 { border-left-color: var(--d3); }
  .entry.b4 { border-left-color: var(--d4); }
  .entry header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .entry h3 { font-size: 1rem; }
  .tag { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .note { white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0 0; line-height: 1.65; }
  .hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
  .legacy textarea { width: 100%; min-height: 120px; resize: vertical; line-height: 1.6; }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(4,7,16,.72);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    width: 100%; max-width: 460px; max-height: 92vh; overflow: auto;
  }
  .modal h3 { font-size: 1.15rem; }
  .msub { color: var(--muted); margin: 2px 0 14px; font-size: .9rem; }
  .lbl { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  .depth-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .dbtn { border: 0; border-radius: 10px; padding: 12px 4px; color: #fff; font-weight: 600; font-size: .82rem; }
  .dbtn.on { box-shadow: 0 0 0 2px #fff; }
  .stepper { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: .9rem; }
  .stepper div { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-solid); font-size: 1.1rem; }
  .stepper b { min-width: 20px; text-align: center; }
  .modal textarea { width: 100%; min-height: 150px; resize: vertical; line-height: 1.55; }
  .err { color: #ff8087; font-size: .85rem; min-height: 1.3em; margin-top: 8px; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-list button { text-align: left; }
  .modal form { display: flex; flex-direction: column; gap: 10px; }

  @media (max-width: 520px) {
    :root { --label-w: 158px; --cell-w: 96px; }
    .label .counts { display: none; }
    .depth-btns { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  /* ---------- constants ---------- */
  var STORE_KEY = "study-tracker-v1";
  var TYPES = ["Research", "Experiment", "Practice", "Reading", "Review", "Memorization", "Other"];
  var DEPTHS = {
    1: { name: "Low", points: 2 },
    2: { name: "Moderate", points: 5 },
    3: { name: "High", points: 9 },
    4: { name: "Higher", points: 14 }
  };
  var MASTERY_SCALE = 60;   // bigger number = mastery climbs more slowly

  /* ---------- state ---------- */
  var state = { topics: [] };
  var view = { topicId: null, extra: 0, asc: true, savedX: 0, savedY: 0 };
  var app = document.getElementById("app");
  var modalEl = null;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) { state = { topics: [] }; }
    normalize();
  }
  function normalize() {
    if (!state || !Array.isArray(state.topics)) state = { topics: [] };
    state.topics.forEach(function (t) {
      t.id = t.id || uid();
      t.name = String(t.name || "Untitled");
      if (TYPES.indexOf(t.type) < 0) t.type = "Other";
      t.opens = +t.opens || 0;
      t.notes = typeof t.notes === "string" ? t.notes : "";
      if (!t.days || typeof t.days !== "object") t.days = {};
      Object.keys(t.days).forEach(function (d) {
        var e = t.days[d];
        if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(d)) { delete t.days[d]; return; }
        var depth = +e.depth;
        if (!(depth >= 1 && depth <= 4)) depth = 1;
        t.days[d] = { depth: depth, count: Math.max(1, +e.count || 1), note: typeof e.note === "string" ? e.note : "" };
      });
    });
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }

  /* ---------- helpers ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function toStr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return toStr(new Date()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function getTopic(id) { return state.topics.filter(function (t) { return t.id === id; })[0]; }
  function yearOf(s) { return +s.slice(0, 4); }
  function thisYear() { return new Date().getFullYear(); }

  function cellLabel(s) {
    var d = parse(s);
    if (s === today()) return "Today, " + d.toLocaleDateString(undefined, { weekday: "short" });
    var txt = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    if (yearOf(s) !== thisYear()) txt += " '" + String(yearOf(s)).slice(2);
    return txt;
  }
  function noteDate(s) {   // "Jun 15, Tuesday"
    var d = parse(s);
    var txt = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    if (yearOf(s) !== thisYear()) txt += ", " + yearOf(s);
    return txt + ", " + d.toLocaleDateString(undefined, { weekday: "long" });
  }
  function fullDate(s) {
    return parse(s).toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  }

  function masteryFrom(total) { return Math.round(100 * (1 - Math.exp(-total / MASTERY_SCALE))); }
  function mastery(t) {
    var total = 0;
    Object.keys(t.days).forEach(function (d) { total += DEPTHS[t.days[d].depth].points; });
    return masteryFrom(total);
  }
  function cumulative(t) {   // mastery % after each studied day
    var keys = Object.keys(t.days).sort(), tot = 0, out = {};
    keys.forEach(function (d) { tot += DEPTHS[t.days[d].depth].points; out[d] = masteryFrom(tot); });
    return out;
  }
  function band(p) { return p < 25 ? 1 : p < 50 ? 2 : p < 75 ? 3 : 4; }
  function masteryLabel(p) {
    if (p < 20) return "Just starting";
    if (p < 45) return "Building";
    if (p < 70) return "Solid";
    if (p < 90) return "Strong";
    return "Deep mastery";
  }
  function daysStudied(t) { return Object.keys(t.days).length; }
  function timesStudied(t) {
    var n = 0;
    Object.keys(t.days).forEach(function (d) { n += t.days[d].count; });
    return n;
  }

  function ring(p, size) {
    var sw = 3.5, r = (size - sw) / 2, c = 2 * Math.PI * r, dash = (c * p / 100).toFixed(2), h = size / 2;
    return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
      '<circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="' + sw + '"/>' +
      '<circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="#fff" stroke-width="' + sw + '" stroke-linecap="round" ' +
      'stroke-dasharray="' + dash + ' ' + c.toFixed(2) + '" transform="rotate(-90 ' + h + ' ' + h + ')"/>' +
      '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="' + (size * 0.27).toFixed(1) + '" font-weight="700">' + p + '%</text></svg>';
  }

  /* ---------- date range for the board ---------- */
  function dateList() {
    var earliest = null;
    state.topics.forEach(function (t) {
      Object.keys(t.days).forEach(function (d) { if (!earliest || d < earliest) earliest = d; });
    });
    var back = 13;
    if (earliest) {
      var diff = Math.round((parse(today()) - parse(earliest)) / 86400000);
      back = Math.max(back, diff);
    }
    back += view.extra;
    var list = [], d = parse(today());
    for (var i = 0; i <= back; i++) { list.push(toStr(d)); d.setDate(d.getDate() - 1); }
    return list;
  }

  /* ---------- drawing ---------- */
  function render() {
    var b = document.getElementById("board");
    var sx = b ? b.scrollLeft : 0, sy = window.scrollY;
    draw();
    var b2 = document.getElementById("board");
    if (b2) b2.scrollLeft = sx;
    window.scrollTo(0, sy);
  }
  function draw() {
    if (view.topicId && getTopic(view.topicId)) drawTopic();
    else { view.topicId = null; drawBoard(); }
  }

  function drawBoard() {
    var html = '<div class="top"><div><h1>Study Tracker</h1>' +
      '<p class="sub">Tap a day to log it. Tap a topic to read its notes. Swipe left for older days.</p></div>' +
      '<button class="btn primary" data-act="add">+ Add topic</button></div>';

    html += '<div class="legend"><span><i class="c1"></i>Low</span><span><i class="c2"></i>Moderate</span>' +
            '<span><i class="c3"></i>High</span><span><i class="c4"></i>Higher</span><span><i></i>Not studied</span></div>';

    if (!state.topics.length) {
      html += '<div class="empty-state"><p>No topics yet. Add what you want to study.</p>' +
              '<button class="btn primary" data-act="add">+ Add your first topic</button></div>';
    } else {
      var dates = dateList(), tdy = today();
      html += '<div class="board" id="board"><div class="rows">';
      state.topics.forEach(function (t) {
        var p = mastery(t), cum = cumulative(t);
        html += '<div class="row"><div class="label m' + band(p) + '">' +
          '<button class="open" data-topic="' + t.id + '" aria-label="Open notes for ' + esc(t.name) + '">' + ring(p, 38) +
          '<span class="txt"><span class="nm">' + esc(t.name) + '</span>' +
          '<small>' + esc(t.type) + '</small>' +
          '<small class="counts">' + t.opens + ' opens, ' + timesStudied(t) + ' studied</small></span></button>' +
          '<button class="dots" data-menu="' + t.id + '" aria-label="Options for ' + esc(t.name) + '">⋮</button></div>';
        dates.forEach(function (s) {
          var e = t.days[s], cls = "cell", inner;
          if (s === tdy) cls += " today";
          if (e) {
            cls += " c" + e.depth;
            inner = '<span class="d">' + esc(cellLabel(s)) + '</span><b>' + cum[s] + '%</b>' + (e.note ? '<span class="note-dot" title="Has notes"></span>' : "");
          } else {
            cls += " none";
            inner = '<span class="d">' + esc(cellLabel(s)) + '</span>';
          }
          html += '<button class="' + cls + '" data-cell="' + t.id + '|' + s + '" aria-label="' +
                  esc(t.name + ", " + fullDate(s) + (e ? ", " + DEPTHS[e.depth].name + " depth" : ", not studied")) + '">' + inner + '</button>';
        });
        html += '</div>';
      });
      html += '</div></div>';
      html += '<div class="more"><button class="btn small" data-act="more">Show 30 earlier days</button>' +
              '<span>Showing back to ' + esc(cellLabel(dates[dates.length - 1])) + '</span></div>';
    }

    html += '<footer><span>Saved in this browser.</span>' +
            '<button class="btn small" data-act="export">Export backup</button>' +
            '<button class="btn small" data-act="import">Import backup</button>' +
            '<input type="file" id="importFile" accept="application/json" hidden></footer>';
    app.innerHTML = html;
  }

  function drawTopic() {
    var t = getTopic(view.topicId), p = mastery(t);
    var keys = Object.keys(t.days).sort();
    if (!view.asc) keys.reverse();
    var withNotes = keys.filter(function (d) { return t.days[d].note; });
    var noNotes = keys.length - withNotes.length;

    var html = '<button class="btn back" data-act="back">← Back to board</button>';
    html += '<div class="thead"><div class="who"><span class="ring-wrap m' + band(p) + '" style="background:var(--m' + band(p) + ')">' + ring(p, 62) + '</span>' +
      '<div><h1>' + esc(t.name) + '</h1><p class="sub">' + esc(t.type) + ' · ' + masteryLabel(p) + '</p></div></div>' +
      '<div class="row-actions"><select id="typeSel" aria-label="Type of study">' +
      TYPES.map(function (x) { return "<option" + (x === t.type ? " selected" : "") + ">" + x + "</option>"; }).join("") +
      '</select><button class="btn small" data-act="rename">Rename</button>' +
      '<button class="btn small danger" data-act="delete">Delete</button></div></div>';

    html += '<div class="stats">' +
      '<div class="stat"><b>' + p + '%</b><span>Mastery</span></div>' +
      '<div class="stat"><b>' + t.opens + '</b><span>Times opened</span></div>' +
      '<div class="stat"><b>' + timesStudied(t) + '</b><span>Times studied</span></div>' +
      '<div class="stat"><b>' + daysStudied(t) + '</b><span>Days studied</span></div></div>';

    html += '<div class="sec-head"><h2>Notes by day</h2>' +
            '<button class="btn small" data-act="sort">' + (view.asc ? "Oldest first" : "Newest first") + ' (switch)</button></div>';

    if (!withNotes.length) {
      html += '<div class="empty-state"><p>No notes yet. Tap a day on the board and write one.</p></div>';
    } else {
      withNotes.forEach(function (d) {
        var e = t.days[d];
        html += '<article class="entry b' + e.depth + '"><header><div><h3>' + esc(noteDate(d)) + '</h3>' +
          '<span class="tag"><i class="dot c' + e.depth + '"></i>' + DEPTHS[e.depth].name + ' depth, ' + e.count + ' session' + (e.count === 1 ? "" : "s") + '</span></div>' +
          '<button class="btn small" data-edit="' + d + '">Edit</button></header>' +
          '<p class="note">' + esc(e.note) + '</p></article>';
      });
    }
    if (noNotes > 0 && withNotes.length) {
      html += '<p class="hint">' + noNotes + ' studied day' + (noNotes === 1 ? " has" : "s have") + ' no notes.</p>';
    }

    if (t.notes.trim()) {
      html += '<div class="sec-head"><h2>Earlier notes</h2></div><div class="legacy">' +
              '<textarea id="legacyNotes" aria-label="Earlier notes">' + esc(t.notes) + '</textarea>' +
              '<p class="hint">Written in the first version, before notes were added per day.</p></div>';
    }
    app.innerHTML = html;
  }

  /* ---------- modal ---------- */
  function openModal(html, ready) {
    closeModal();
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true" tabindex="-1">' + html + "</div>";
    document.body.appendChild(ov);
    modalEl = ov;
    document.body.style.overflow = "hidden";
    ov.addEventListener("mousedown", function (e) { if (e.target === ov) closeModal(); });
    var m = ov.firstChild;
    m.focus();
    if (ready) ready(m);
  }
  function closeModal() {
    if (modalEl) { modalEl.remove(); modalEl = null; document.body.style.overflow = ""; }
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  function typeOptions(sel) {
    return TYPES.map(function (x) { return "<option" + (x === sel ? " selected" : "") + ">" + x + "</option>"; }).join("");
  }

  function openAdd() {
    openModal('<h3>Add topic</h3><p class="msub">What do you want to study?</p>' +
      '<form id="addForm"><input type="text" id="newName" maxlength="80" placeholder="e.g. Stoic ethics" aria-label="Topic name" required>' +
      '<label class="lbl" for="newType" style="margin:4px 0 0">Type of study</label><select id="newType">' + typeOptions("Research") + '</select>' +
      '<div class="actions"><span class="grow"></span><button type="button" class="btn" data-do="cancel">Cancel</button>' +
      '<button type="submit" class="btn primary">Add topic</button></div></form>',
      function (m) {
        m.querySelector("[data-do=cancel]").addEventListener("click", closeModal);
        m.querySelector("#addForm").addEventListener("submit", function (e) {
          e.preventDefault();
          var name = m.querySelector("#newName").value.trim();
          if (!name) return;
          state.topics.unshift({ id: uid(), name: name, type: m.querySelector("#newType").value, opens: 0, notes: "", days: {} });
          save(); closeModal(); render();
        });
      });
  }

  function openMenu(id) {
    var t = getTopic(id);
    if (!t) return;
    openModal('<h3>' + esc(t.name) + '</h3><p class="msub">' + esc(t.type) + '</p><div class="menu-list">' +
      '<button class="btn" data-m="notes">View notes</button><button class="btn" data-m="rename">Rename</button>' +
      '<label class="lbl" for="mType" style="margin:6px 0 0">Type of study</label><select id="mType">' + typeOptions(t.type) + '</select>' +
      '<button class="btn danger" data-m="delete">Delete topic</button><button class="btn" data-m="close">Close</button></div>',
      function (m) {
        m.querySelector("#mType").addEventListener("change", function (e) { t.type = e.target.value; save(); closeModal(); render(); });
        m.addEventListener("click", function (e) {
          var b = e.target.closest("[data-m]");
          if (!b) return;
          var a = b.getAttribute("data-m");
          if (a === "close") closeModal();
          if (a === "notes") { closeModal(); openTopic(id); }
          if (a === "rename") { closeModal(); renameTopic(id); }
          if (a === "delete") { closeModal(); deleteTopic(id); }
        });
      });
  }

  function renameTopic(id) {
    var t = getTopic(id);
    var n = prompt("Rename topic", t.name);
    if (n && n.trim()) { t.name = n.trim().slice(0, 80); save(); render(); }
  }
  function deleteTopic(id) {
    var t = getTopic(id);
    if (confirm('Delete "' + t.name + '" with all its days and notes? This cannot be undone.')) {
      state.topics = state.topics.filter(function (x) { return x.id !== id; });
      save();
      if (view.topicId === id) { view.topicId = null; draw(); window.scrollTo(0, 0); }
      else render();
    }
  }

  function openDay(id, date) {
    var t = getTopic(id);
    if (!t) return;
    var ex = t.days[date];
    var st = { depth: ex ? ex.depth : 0, count: ex ? ex.count : 1 };
    var html = '<h3>' + esc(fullDate(date)) + '</h3><p class="msub">' + esc(t.name) + ' · ' + esc(t.type) + '</p>' +
      '<div class="lbl" style="margin-top:0">How deep did you go?</div><div class="depth-btns">' +
      [1, 2, 3, 4].map(function (n) {
        return '<button type="button" class="dbtn c' + n + (st.depth === n ? " on" : "") + '" data-d="' + n + '">' + DEPTHS[n].name + '</button>';
      }).join("") + '</div>' +
      '<div class="stepper"><span>Study sessions this day</span><div>' +
      '<button type="button" data-step="-1" aria-label="Fewer sessions">−</button><b id="cnt">' + st.count + '</b>' +
      '<button type="button" data-step="1" aria-label="More sessions">+</button></div></div>' +
      '<label class="lbl" for="dayNote">Notes for this day</label>' +
      '<textarea id="dayNote" placeholder="- What did you learn or do?">' + esc(ex ? ex.note : "") + '</textarea>' +
      '<div class="err" id="err" role="alert"></div>' +
      '<div class="actions">' + (ex ? '<button type="button" class="btn danger" data-do="clear">Clear day</button>' : "") +
      '<span class="grow"></span><button type="button" class="btn" data-do="cancel">Cancel</button>' +
      '<button type="button" class="btn primary" data-do="save">Save</button></div>';

    openModal(html, function (m) {
      m.addEventListener("click", function (e) {
        var d = e.target.closest("[data-d]");
        if (d) {
          st.depth = +d.getAttribute("data-d");
          Array.prototype.forEach.call(m.querySelectorAll("[data-d]"), function (b) {
            b.classList.toggle("on", +b.getAttribute("data-d") === st.depth);
          });
          m.querySelector("#err").textContent = "";
          return;
        }
        var s = e.target.closest("[data-step]");
        if (s) {
          st.count = Math.max(1, st.count + +s.getAttribute("data-step"));
          m.querySelector("#cnt").textContent = st.count;
          return;
        }
        var a = e.target.closest("[data-do]");
        if (!a) return;
        var act = a.getAttribute("data-do");
        if (act === "cancel") closeModal();
        if (act === "clear") {
          if (confirm("Clear this day, including its notes?")) { delete t.days[date]; save(); closeModal(); render(); }
        }
        if (act === "save") {
          if (!st.depth) { m.querySelector("#err").textContent = "Pick how deep you went first."; return; }
          t.days[date] = { depth: st.depth, count: st.count, note: m.querySelector("#dayNote").value.replace(/\s+$/, "") };
          save(); closeModal(); render();
        }
      });
    });
  }

  /* ---------- navigation ---------- */
  function openTopic(id) {
    var t = getTopic(id);
    if (!t) return;
    var b = document.getElementById("board");
    view.savedX = b ? b.scrollLeft : 0;
    view.savedY = window.scrollY;
    t.opens += 1;
    save();
    view.topicId = id;
    draw();
    window.scrollTo(0, 0);
  }
  function backToBoard() {
    view.topicId = null;
    draw();
    var b = document.getElementById("board");
    if (b) b.scrollLeft = view.savedX;
    window.scrollTo(0, view.savedY);
  }

  /* ---------- backup ---------- */
  function exportData() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "study-tracker-backup-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function importData(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.topics)) throw new Error("bad file");
        if (confirm("Replace your current topics with this backup?")) {
          state = data; normalize(); save(); view.topicId = null; draw();
        }
      } catch (err) { alert("That file isn't a valid Study Tracker backup."); }
    };
    r.readAsText(file);
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function (e) {
    var t = e.target;
    var el = t.closest("[data-cell]");
    if (el) { var p = el.getAttribute("data-cell").split("|"); openDay(p[0], p[1]); return; }
    el = t.closest("[data-topic]");
    if (el) { openTopic(el.getAttribute("data-topic")); return; }
    el = t.closest("[data-menu]");
    if (el) { openMenu(el.getAttribute("data-menu")); return; }
    el = t.closest("[data-edit]");
    if (el) { openDay(view.topicId, el.getAttribute("data-edit")); return; }
    el = t.closest("[data-act]");
    if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "add") openAdd();
    else if (a === "more") { view.extra += 30; render(); }
    else if (a === "back") backToBoard();
    else if (a === "sort") { view.asc = !view.asc; render(); }
    else if (a === "rename") renameTopic(view.topicId);
    else if (a === "delete") deleteTopic(view.topicId);
    else if (a === "export") exportData();
    else if (a === "import") document.getElementById("importFile").click();
  });
  app.addEventListener("change", function (e) {
    if (e.target.id === "typeSel") {
      var tp = getTopic(view.topicId);
      tp.type = e.target.value; save(); render();
    }
    if (e.target.id === "importFile" && e.target.files[0]) importData(e.target.files[0]);
  });
  var legacyTimer = null;
  app.addEventListener("input", function (e) {
    if (e.target.id === "legacyNotes") {
      var tp = getTopic(view.topicId);
      tp.notes = e.target.value;
      clearTimeout(legacyTimer);
      legacyTimer = setTimeout(save, 400);
    }
  });

  /* ---------- start ---------- */
  load();
  draw();
})();
</script>
</body>
</html>
